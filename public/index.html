<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kafka Viz</title>
<link rel="stylesheet" href="style.css" />
<script>
  // Set the theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var stored = localStorage.getItem('kvt-theme');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="5" cy="12" r="2.4" fill="currentColor"/>
        <circle cx="19" cy="5" r="2.4" fill="currentColor"/>
        <circle cx="19" cy="19" r="2.4" fill="currentColor"/>
        <line x1="7" y1="12" x2="17" y2="6" stroke="currentColor" stroke-width="1.6"/>
        <line x1="7" y1="12" x2="17" y2="18" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span>kafka-viz</span>
    </div>

    <nav class="tabs">
      <button class="tab active" data-page="topics">Topics &amp; messages</button>
      <button class="tab" data-page="publish">Publish</button>
    </nav>

    <div class="topbar-right">
      <select id="env-select" class="env-select"></select>
      <button id="theme-toggle" class="icon-btn" title="Toggle light/dark theme">
        <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" hidden>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" hidden>
          <path d="M20 14.3A8.3 8.3 0 119.7 4a6.7 6.7 0 0010.3 10.3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="open-settings" class="icon-btn" title="Environments &amp; Kafka path">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 13.5c.04-.5.04-1 0-1.5l1.6-1.25a.5.5 0 00.12-.64l-1.5-2.6a.5.5 0 00-.6-.22l-1.9.76a7.3 7.3 0 00-1.3-.76l-.28-2a.5.5 0 00-.5-.44h-3a.5.5 0 00-.5.44l-.29 2a7.3 7.3 0 00-1.3.76l-1.9-.76a.5.5 0 00-.6.22l-1.5 2.6a.5.5 0 00.12.64L6.6 12c-.04.5-.04 1 0 1.5l-1.6 1.25a.5.5 0 00-.12.64l1.5 2.6c.13.22.4.31.6.22l1.9-.76c.4.32.83.57 1.3.76l.29 2c.04.25.26.44.5.44h3c.24 0 .46-.19.5-.44l.28-2c.47-.19.9-.44 1.3-.76l1.9.76c.2.09.47 0 .6-.22l1.5-2.6a.5.5 0 00-.12-.64L19.4 13.5z" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- ===================== TOPICS & MESSAGES PAGE ===================== -->
    <section id="page-topics" class="page active">
      <aside id="topic-pane" class="topic-pane">
        <div class="pane-header">
          <input id="topic-filter" type="text" placeholder="Filter topics…" />
          <button id="refresh-topics" class="icon-btn" title="Refresh topics">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="new-topic-btn" class="icon-btn" title="Create a new topic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <ul id="topic-list" class="topic-list"></ul>
      </aside>

      <div id="topic-pane-resizer" class="pane-resizer" title="Drag to resize"></div>

      <section class="center-column">
        <!-- ===== topic details bar ===== -->
        <div class="topic-details-bar">
          <div class="topic-details-header">
            <h2 id="current-topic-name">Select a topic</h2>
            <p id="loaded-until" class="muted"></p>
          </div>
          <div class="message-controls">
            <div class="message-controls-group">
              <button id="refresh-messages" class="btn" disabled>Reload</button>
              <button id="view-details-btn" class="btn" disabled>View details</button>
              <button id="publish-to-topic-btn" class="btn" disabled>Publish message</button>
            </div>
            <div class="message-controls-group message-controls-danger">
              <button id="purge-topic-btn" class="btn btn-danger" disabled>Purge messages</button>
              <button id="delete-topic-btn" class="btn btn-danger" disabled>Delete topic</button>
            </div>
          </div>
        </div>

        <!-- ===== filters ===== -->
        <div class="message-filters">
          <input id="message-search" type="text" placeholder="Search loaded messages…" disabled />
          <select id="filter-partition" disabled>
            <option value="">All partitions</option>
          </select>
          <input id="filter-key" type="text" placeholder="Filter by key…" disabled />
          <input id="filter-date-from" type="date" title="From date" disabled />
          <input id="filter-date-to" type="date" title="To date" disabled />
          <button id="clear-filters" class="btn" disabled>Clear</button>
        </div>

        <!-- ===== message list + message detail split ===== -->
        <div class="lower-split">
          <section class="message-list-pane">
            <div id="message-stream" class="message-stream">
              <p class="empty-hint">Pick a topic on the left to load its most recent messages.</p>
            </div>
            <button id="load-older-btn" class="btn load-older-btn" hidden>Load older messages</button>
          </section>

          <section class="message-detail-pane">
            <div id="message-detail" class="message-detail">
              <p class="empty-hint">Select a message to see its full payload.</p>
            </div>
          </section>
        </div>
      </section>
    </section>

    <!-- ===================== PUBLISH PAGE ===================== -->
    <section id="page-publish" class="page">
      <div class="publish-panel">
        <h2>Publish a message</h2>
        <label class="field-label" for="publish-topic">Topic</label>
        <input id="publish-topic" type="text" placeholder="e.g. orders.created" />

        <div class="publish-row">
          <div class="publish-field">
            <label class="field-label" for="publish-key">Key <span class="muted">(optional)</span></label>
            <input id="publish-key" type="text" placeholder="e.g. order-123" />
          </div>
          <div class="publish-field">
            <div class="field-label-row">
              <label class="field-label" for="publish-partition-select">Partition <span class="muted">(optional)</span></label>
              <button id="publish-partition-toggle" class="link-btn" type="button">Enter manually</button>
            </div>
            <select id="publish-partition-select">
              <option value="">No preference</option>
            </select>
            <input id="publish-partition-input" type="number" min="0" step="1" placeholder="e.g. 0" style="display:none" />
            <p id="publish-partition-hint" class="muted"></p>
          </div>
        </div>

        <label class="field-label" for="publish-json">Message (JSON)</label>
        <textarea id="publish-json" spellcheck="false" placeholder='{
  "example": "value"
}'></textarea>

        <div class="publish-actions">
          <span id="publish-json-status" class="muted"></span>
          <button id="publish-btn" class="btn btn-primary">Publish</button>
        </div>

        <div id="publish-result" class="publish-result"></div>
      </div>
    </section>
  </main>

  <!-- ===================== SETTINGS MODAL ===================== -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Environments &amp; Kafka path</h3>
        <button id="close-settings" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <label class="field-label">Kafka home (contains /bin scripts)</label>
        <div class="inline-row">
          <input id="kafka-home-input" type="text" />
          <button id="save-kafka-home" class="btn">Save</button>
        </div>

        <hr />

        <label class="field-label">Environments</label>
        <ul id="env-list" class="env-list"></ul>

        <div class="add-env-row">
          <input id="new-env-name" type="text" placeholder="Environment name (e.g. QA2)" />
          <input id="new-env-servers" type="text" placeholder="Bootstrap servers, comma separated" />
          <button id="add-env" class="btn btn-primary">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== TOPIC DETAILS MODAL ===================== -->
  <div id="topic-details-modal" class="modal-overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h3 id="topic-details-modal-title">Topic details</h3>
        <button id="close-topic-details" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="topic-details-content"></div>
      </div>
    </div>
  </div>

  <!-- ===================== NEW TOPIC MODAL ===================== -->
  <div id="new-topic-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Create a new topic</h3>
        <button id="close-new-topic" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field-label" for="new-topic-name">Topic name</label>
        <input id="new-topic-name" type="text" placeholder="e.g. orders.created" />

        <div class="publish-row">
          <div class="publish-field">
            <label class="field-label" for="new-topic-partitions">Partitions</label>
            <input id="new-topic-partitions" type="number" min="1" step="1" value="1" />
          </div>
          <div class="publish-field">
            <label class="field-label" for="new-topic-replication">Replication factor</label>
            <input id="new-topic-replication" type="number" min="1" step="1" value="1" />
          </div>
        </div>
        <p id="new-topic-error" class="muted"></p>
      </div>
      <div class="modal-footer">
        <button id="cancel-new-topic" class="btn">Cancel</button>
        <button id="create-new-topic" class="btn btn-primary">Create</button>
      </div>
    </div>
  </div>

  <!-- ===================== CONFIRM-BY-TYPING MODAL (purge / delete) ===================== -->
  <div id="confirm-name-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="confirm-name-title">Confirm action</h3>
        <button id="confirm-name-close" class="icon-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p id="confirm-name-message" class="muted"></p>
        <label class="field-label" for="confirm-name-input">Type the topic name to confirm</label>
        <input id="confirm-name-input" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <div class="modal-footer">
        <button id="confirm-name-cancel" class="btn">Cancel</button>
        <button id="confirm-name-confirm" class="btn btn-danger" disabled>Confirm</button>
      </div>
    </div>
  </div>

  <!-- ===================== BUSY OVERLAY ===================== -->
  <div id="busy-overlay" class="modal-overlay busy-overlay">
    <div class="busy-box">
      <span class="spinner"></span>
      <span id="busy-message">Working…</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
